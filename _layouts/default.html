<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Philip Lampkin",
    "alternateName": "Philip P. Lampkin",
    "url": "https://philip-lampkin.me/",
    "image": "https://philip-lampkin.me/assets/headshot.jpg",
    "jobTitle": "Postdoctoral Scholar",
    "worksFor": { "@type": "Organization", "name": "University of Utah" },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "University of Wisconsin–Madison" },
      { "@type": "CollegeOrUniversity", "name": "University of San Francisco" }
    ],
    "sameAs": [
      "https://scholar.google.com/citations?user=h5jm0eEAAAAJ&hl=en",
      "https://github.com/plampkin",
      "https://bsky.app/profile/philiplampkin.bsky.social",
      "https://www.linkedin.com/in/philip-p-lampkin/",
      "https://orcid.org/0000-0002-6908-9619"
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">

    {{ content }}

    <footer>
      built with jekyll · last updated {{ site.time | date: "%B %Y" }}
    </footer>

  </div>

  <script>
    function switchTab(id, btn) {
      var group = btn.closest('.tabs-group');
      group.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      group.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
    }
  </script>
</body>
</html>
