# Research interests (the bordered list)
interests:
  - title: New Polymerizations and Functional Materials
    desc: How do we design materials that exhibit the best of properties of biopolymers and synthetic polymers? How can we overcome the limitations of current polymers to address the plastic waste crisis?
  - title: Data Chemistry
    desc: How do we best leverage sparse chemistry data to guide experimental efforts? What AI/ML methods are most useful for chemists and how do we make them accessible to experimentalists?
  - title: Catalysis
    desc: What is required to discover new catalysts that enable fundamentally new reactivity? How do we design catalysts that achieve selectivity through enhancing reactivity? What synthetic strategies haven't been examined and what catalysts might enable them?


