# Bio paragraph (shown below the header links)
bio: >
  I'm a postdoctoral scholar working at the meeting point of polymer science, physical organic
  chemistry and AI. Previously, I developed bifunctional catalysts that mimic design elements
  found in enzymes, built open-source tools for visible-light photochemistry, and created 
  advanced organic chemistry lab curricula that bridge the gap between research and teaching labs.

