bio: >
  I am a postdoctoral fellow engaged in research at the intersection of polymers, physical
  organic chemistry and data science. I curretly work on the design of highly strained
  monomers that endow materials with on-demand reactivity and development of strategies
  for AI-guided optimization of frontal polymerizations. Previously, I created bifunctional
  catalysts that mimic design elements found in enzymes, built open-source reactors for
  visible-light photochemistry, created organic chemistry curricula that introduced
  cutting-edge research to teaching labs and studied carbon tunneling in organic reactions
  using DFT.

# Research interests (the bordered list)
interests:
  - title: New Polymerizations and Functional Materials
    desc: Can we design polymers that match the performance of current plastics but have diverse end-of-life options and functionalities? 
          How do we design materials that merge the best properties of biopolymers and synthetic polymers? 
  - title: Data Chemistry
    desc: How do we best leverage sparse data to guide experimental chemistry efforts?
          Which AI/ML methods actually help chemists and how do we make them accessible to experimentalists?
  - title: Catalysis
    desc: What is required to discover catalysts that unlock fundamentally new reactivity?
          How do we achieve selectivity by enhancing reactivity rather than suppressing it?
          Which synthetic strategies remain out of reach, why haven't they been examined, and what catalysts might make them possible?


