# Bio paragraph (shown below the header links)
bio: >
  I'm a chemist working at the meeting point of polymer science, physical organic chemistry
  and data science. Previously, I developed bifunctional catalysts that mimic design elements
  found in enzymes, built open-source tools for visible-light photochemistry, and designed 
  organic chemistry curricula bridging the gap between research and teaching labs.

